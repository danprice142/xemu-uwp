general:
  show_welcome:
    type: bool
    default: true
  updates:
    check:
      type: bool
      default: true
  screenshot_dir: string
  games_dir: string
  library_on_launch:
    type: bool
    default: true
  screenscraper:
    username: string
    media_dir: string
    box_art_style:
      type: enum
      values: [box_2d, box_3d, mix_v1, mix_v2, fan_art, screenshot, logo, box_back, disc]
      default: box_2d
    large_box_art_style:
      type: enum
      values: [box_2d, box_3d, mix_v1, mix_v2, fan_art, screenshot, logo, box_back, disc]
      default: box_2d
    background:
      type: enum
      values: ['off', fan_art, screenshot, video, mix_v1, mix_v2]
      default: fan_art
    media:
      box_front:
        type: bool
        default: true
      box_3d:
        type: bool
        default: true
      box_back:
        type: bool
        default: true
      wheels:
        type: bool
        default: true
      physical_media:
        type: bool
        default: true
      mix_v1:
        type: bool
        default: true
      mix_v2:
        type: bool
        default: true
      fan_art:
        type: bool
        default: true
      screenshots:
        type: bool
        default: true
      videos:
        type: bool
        default: true
    overwrite_assets:
      type: bool
      default: false
  skip_boot_anim: bool
  # throttle_io: bool
  last_viewed_menu_index: integer
  user_token: string
  snapshots:
    shortcuts:
      f5: string
      f6: string
      f7: string
      f8: string
    filter_current_game: bool

input:
  bindings:
    port1_driver: string
    port1: string
    port2_driver: string
    port2: string
    port3_driver: string
    port3: string
    port4_driver: string
    port4: string
  peripherals:
    port1:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
    port2:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
    port3:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
    port4:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
  gamecontrollerdb_path: string
  auto_bind:
    type: bool
    default: true
  # Deprecated: use 'enable_rumble' on the controller mapping settings instead
  allow_vibration:
    type: bool
    default: true
  background_input_capture: bool
  # Lightgun aim smoothing and sensitivity. On UWP the pointer source is DSU
  # touch input; desktop pointer backends may use the same values.
  lightgun_smoothing:
    type: number
    default: 0.2
  lightgun_sensitivity:
    type: number
    default: 1.0
  dsu:
    # DSU protocol UDP endpoints. Each player may use a separate
    # DSU server; the slot selects the controller on that server.
    player1:
      enabled:
        type: bool
        default: false
      server_address:
        type: string
        default: 127.0.0.1
      server_port:
        type: integer
        default: 26760
      slot:
        type: integer
        default: 0
      addon:
        type: bool
        default: false
      gamepad:
        type: bool
        default: true
      motion:
        type: bool
        default: false
      motion_target:
        type: enum
        values: [mouse, right_stick, left_stick, dpad, lightgun]
        default: right_stick
      motion_sensitivity_horizontal:
        type: number
        default: 1.0
      motion_sensitivity_vertical:
        type: number
        default: 1.0
      touch:
        type: bool
        default: true
      keyboard:
        type: bool
        default: true
      mouse:
        type: bool
        default: true
    player2:
      enabled:
        type: bool
        default: false
      server_address:
        type: string
        default: 127.0.0.1
      server_port:
        type: integer
        default: 26760
      slot:
        type: integer
        default: 1
      addon:
        type: bool
        default: false
      gamepad:
        type: bool
        default: true
      motion:
        type: bool
        default: false
      motion_target:
        type: enum
        values: [mouse, right_stick, left_stick, dpad, lightgun]
        default: right_stick
      motion_sensitivity_horizontal:
        type: number
        default: 1.0
      motion_sensitivity_vertical:
        type: number
        default: 1.0
      touch:
        type: bool
        default: true
      keyboard:
        type: bool
        default: true
      mouse:
        type: bool
        default: true
    player3:
      enabled:
        type: bool
        default: false
      server_address:
        type: string
        default: 127.0.0.1
      server_port:
        type: integer
        default: 26760
      slot:
        type: integer
        default: 2
      addon:
        type: bool
        default: false
      gamepad:
        type: bool
        default: true
      motion:
        type: bool
        default: false
      motion_target:
        type: enum
        values: [mouse, right_stick, left_stick, dpad, lightgun]
        default: right_stick
      motion_sensitivity_horizontal:
        type: number
        default: 1.0
      motion_sensitivity_vertical:
        type: number
        default: 1.0
      touch:
        type: bool
        default: true
      keyboard:
        type: bool
        default: true
      mouse:
        type: bool
        default: true
    player4:
      enabled:
        type: bool
        default: false
      server_address:
        type: string
        default: 127.0.0.1
      server_port:
        type: integer
        default: 26760
      slot:
        type: integer
        default: 3
      addon:
        type: bool
        default: false
      gamepad:
        type: bool
        default: true
      motion:
        type: bool
        default: false
      motion_target:
        type: enum
        values: [mouse, right_stick, left_stick, dpad, lightgun]
        default: right_stick
      motion_sensitivity_horizontal:
        type: number
        default: 1.0
      motion_sensitivity_vertical:
        type: number
        default: 1.0
      touch:
        type: bool
        default: true
      keyboard:
        type: bool
        default: true
      mouse:
        type: bool
        default: true
  keyboard_controller_scancode_map:
    # Scancode reference : https://github.com/libsdl-org/SDL/blob/main/include/SDL_scancode.h
    a:
      type: integer
      default: 4 # a
    b:
      type: integer
      default: 5 # b
    x:
      type: integer
      default: 27 # x
    y:
      type: integer
      default: 28 # y
    dpad_left:
      type: integer
      default: 80 # left
    dpad_up:
      type: integer
      default: 82 # up
    dpad_right:
      type: integer
      default: 79 # right
    dpad_down:
      type: integer
      default: 81 # down
    back:
      type: integer
      default: 42 # backspace
    start:
      type: integer
      default: 40 # return
    white:
      type: integer
      default: 30 # 1
    black:
      type: integer
      default: 31 # 2
    lstick_btn:
      type: integer
      default: 32 # 3
    rstick_btn:
      type: integer
      default: 33 # 4
    guide:
      type: integer
      default: 34 # 5
    lstick_up:
      type: integer
      default: 8 # e
    lstick_left:
      type: integer
      default: 22 # s
    lstick_right:
      type: integer
      default: 9 # f
    lstick_down:
      type: integer
      default: 7 # d
    ltrigger:
      type: integer
      default: 26 # w
    rstick_up:
      type: integer
      default: 12 # i
    rstick_left:
      type: integer
      default: 13 # j
    rstick_right:
      type: integer
      default: 15 # l
    rstick_down:
      type: integer
      default: 14 # k
    rtrigger:
      type: integer
      default: 18 # w
  gamepad_mappings:
    type: array
    items:
      gamepad_id: string
      enable_rumble:
        type: bool
        default: true
      # steel_battalion_mapping:
      # ...
      controller_mapping:
        a:
          type: integer
          default: 0
        b:
          type: integer
          default: 1
        x:
          type: integer
          default: 2
        y:
          type: integer
          default: 3
        back:
          type: integer
          default: 4
        guide:
          type: integer
          default: 5
        start:
          type: integer
          default: 6
        lstick_btn:
          type: integer
          default: 7
        rstick_btn:
          type: integer
          default: 8
        lshoulder:
          type: integer
          default: 9
        rshoulder:
          type: integer
          default: 10
        dpad_up:
          type: integer
          default: 11
        dpad_down:
          type: integer
          default: 12
        dpad_left:
          type: integer
          default: 13
        dpad_right:
          type: integer
          default: 14
        axis_left_x:
          type: integer
          default: 0
        axis_left_y:
          type: integer
          default: 1
        axis_right_x:
          type: integer
          default: 2
        axis_right_y:
          type: integer
          default: 3
        axis_trigger_left:
          type: integer
          default: 4
        axis_trigger_right:
          type: integer
          default: 5
        invert_axis_left_x:
          type: bool
          default: false
        invert_axis_left_y:
          type: bool
          default: false
        invert_axis_right_x:
          type: bool
          default: false
        invert_axis_right_y:
          type: bool
          default: false

display:
  renderer:
    type: enum
    values: ["NULL", OPENGL, VULKAN, D3D12]
    default: OPENGL
  stream:
    # When enabled the broadcast is started automatically and kept active.
    broadcast_enabled:
      type: bool
      default: false
    # When enabled, third-party apps may start/stop the broadcast over the
    # control channel (UDP text commands "START"/"STOP" on control_port).
    remote_start:
      type: bool
      default: false
    # H.264 broadcast output URL. Editable in-app.
    url:
      type: string
      default: udp://192.168.1.22:26960
    # UDP port the remote-start control channel listens on.
    control_port:
      type: integer
      default: 26961
    # Target streaming framerate.
    fps:
      type: integer
      default: 30
    # Target streaming bitrate in kbps.
    bitrate_kbps:
      type: integer
      default: 6000
  vulkan:
    validation_layers: bool
    debug_shaders: bool
    assert_on_validation_msg: bool
    preferred_physical_device: string
  quality:
    surface_scale:
      type: integer
      default: 1
  custom_textures:
    # Replace game textures with files from <path>/load/textures/<title ID>.
    load:
      type: bool
      default: false
    # Load a game's whole texture pack in the background when it starts.
    prefetch:
      type: bool
      default: false
    # Save each new game texture to <path>/dump/textures/<title ID>.
    dump:
      type: bool
      default: false
    # Folder holding load/ and dump/; empty selects the default location.
    path: string
  filtering:
    type: enum
    values: [linear, nearest]
    default: linear
  # Upscale the game image to the screen with FSR 1 instead of the filter.
  fsr: bool
  # FSR 1 sharpening strength, from none (0) to the strongest (1).
  fsr_sharpness:
    type: number
    default: 0.8
  window:
    fullscreen_on_startup: bool
    fullscreen_exclusive: bool
    startup_size:
      type: enum
      values: [last_used, 640x480, 720x480, 1280x720, 1280x800, 1280x960, 1920x1080, 2560x1440, 2560x1600, 2560x1920, 3840x2160]
      default: 1280x960
    last_width:
      type: integer
      default: 640
    last_height:
      type: integer
      default: 480
    vsync:
      type: bool
      default: true
  ui:
    show_menubar:
      type: bool
      default: true
    show_notifications:
      type: bool
      default: true
    show_fps:
      type: bool
      default: false
    hide_cursor:
      type: bool
      default: true
    use_animations:
      type: bool
      default: true
    fit:
      type: enum
      values: [center, scale, stretch]
      default: scale
    aspect_ratio:
      type: enum
      values: [native, auto, 4x3, 16x9]
      default: auto
    scale:
      type: float
      default: 1
    auto_scale:
      type: bool
      default: true
  debug:
    video:
      transparency:
        type: bool
        default: false
      x_pos:
        type: number
        default: 100.0
      y_pos:
        type: number
        default: 100.0
      x_winsize:
        type: number
        default: 600.0
      y_winsize:
        type: number
        default: 150.0
      advanced_tree_state:
        type: bool
        default: false
  setup_nvidia_profile:
    type: bool
    default: true

audio:
  vp:
    num_workers:
      type: integer
      default: 0  # 0 = auto
  use_dsp: bool
  use_dsp_jit:
    type: bool
    default: true
  hrtf:
    type: bool
    default: true
  volume_limit:
    type: number
    default: 1

net:
  enable: bool
  backend:
    type: enum
    values: [nat, udp, pcap]
    default: nat
  pcap:
    netif: string
  udp:
    bind_addr:
      type: string
      default: 0.0.0.0:9368
    remote_addr:
      type: string
      default: 1.2.3.4:9368
  nat:
    forward_ports:
      type: array
      items:
        host: integer
        guest: integer
        protocol:
          type: enum
          values: [tcp, udp]
          default: tcp

sys:
  mem_limit:
    type: enum
    values: ['64', '128']
    default: '64'
  avpack:
    type: enum
    values: [scart, hdtv, vga, rfu, svideo, composite, none]
    default: hdtv
  files:
    bootrom_path: string
    flashrom_path: string
    eeprom_path: string
    hdd_path: string
    dvd_path: string

perf:
  hard_fpu:
    type: bool
    default: true
  cache_shaders:
    type: bool
    default: true
  precompile_shaders:
    type: bool
    default: true
  precompile_shaders_wait:
    type: bool
    default: true
